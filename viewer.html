<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>4Bay 아파트 평면도 3D 뷰어</title>
</head>
<body>
<style>
  :root{
    --bg:#0f1216; --bg2:#161b22; --panel:rgba(20,25,32,.82);
    --panel-solid:#161b22; --line:#28313d; --ink:#e8edf4; --muted:#93a0b2;
    --accent:#4c9ffe; --accent-soft:rgba(76,159,254,.16); --amber:#ffd24a;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  :root[data-theme="light"]{
    --bg:#eef1f5; --bg2:#e3e8ef; --panel:rgba(255,255,255,.86);
    --panel-solid:#ffffff; --line:#d2d9e2; --ink:#1a2230; --muted:#5a6675;
    --accent:#1f6fe0; --accent-soft:rgba(31,111,224,.12); --amber:#c8890a;
    --shadow:0 10px 30px rgba(30,40,60,.18);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eef1f5; --bg2:#e3e8ef; --panel:rgba(255,255,255,.86);
      --panel-solid:#ffffff; --line:#d2d9e2; --ink:#1a2230; --muted:#5a6675;
      --accent:#1f6fe0; --accent-soft:rgba(31,111,224,.12); --amber:#c8890a;
      --shadow:0 10px 30px rgba(30,40,60,.18);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1216; --bg2:#161b22; --panel:rgba(20,25,32,.82);
    --panel-solid:#161b22; --line:#28313d; --ink:#e8edf4; --muted:#93a0b2;
    --accent:#4c9ffe; --accent-soft:rgba(76,159,254,.16); --amber:#ffd24a;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,"Helvetica Neue","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #stage.drag{cursor:grabbing}
  .mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  .topbar{position:fixed;top:14px;left:16px;z-index:5;pointer-events:none}
  .topbar h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .topbar h1 .dot{width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .topbar .meta{margin:6px 0 0 17px;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .topbar .meta b{color:var(--ink);font-weight:600}

  .panel{
    position:fixed;z-index:6;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .controls{left:16px;bottom:16px;padding:12px;width:250px}
  .controls .row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .controls .row:last-child{margin-bottom:0}
  button.tool{
    flex:1 1 auto;min-width:0;appearance:none;border:1px solid var(--line);background:var(--bg2);
    color:var(--ink);font-size:12px;font-weight:550;padding:8px 6px;border-radius:9px;cursor:pointer;
    transition:.14s;white-space:nowrap
  }
  button.tool:hover{border-color:var(--accent);color:var(--accent)}
  button.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .slider{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted)}
  .slider input{flex:1;accent-color:var(--accent);cursor:pointer}
  .slider .val{min-width:52px;text-align:right;color:var(--ink)}

  .rooms{right:16px;top:16px;width:220px;padding:11px;max-height:calc(100% - 32px);overflow:auto}
  .rooms h2{margin:2px 4px 9px;font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
  .rm{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 9px;border-radius:9px;
    cursor:pointer;transition:.13s;border:1px solid transparent
  }
  .rm:hover{background:var(--bg2)}
  .rm.active{background:var(--accent-soft);border-color:var(--accent)}
  .rm .nm{font-size:12.5px;font-weight:550}
  .rm .nm small{color:var(--muted);font-weight:400;margin-left:4px}
  .rm .dim{font-size:11px;color:var(--muted);text-align:right;line-height:1.35}
  .rm .dim b{color:var(--accent);font-weight:600}
  .rm.bal .nm{color:var(--muted)}

  .hint{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;
    font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
    padding:6px 13px;border-radius:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;gap:14px;flex-wrap:wrap;justify-content:center;pointer-events:none
  }
  .hint b{color:var(--ink);font-weight:600}
  @media (max-width:760px){
    .controls{width:calc(100% - 32px)}
    .rooms{display:none}
    .topbar .meta{display:none}
    .hint{display:none}
  }
</style>

<canvas id="stage"></canvas>

<div class="topbar">
  <h1><span class="dot"></span>4Bay 아파트 · 평면도 3D 뷰어</h1>
  <div class="meta">
    <span>표준 <b>4베이</b> 판상형</span>
    <span>드래그로 회전 · 각 실 치수(mm) 표시</span>
  </div>
</div>

<div class="panel rooms" id="roomList">
  <h2>실 · 치수</h2>
</div>

<div class="panel controls">
  <div class="row">
    <button class="tool" id="btnReset">시점 초기화</button>
    <button class="tool" id="btnTop">평면(위)</button>
  </div>
  <div class="row">
    <button class="tool on" id="btnDims">치수</button>
    <button class="tool on" id="btnLabels">이름</button>
    <button class="tool" id="btnGhost">벽 반투명</button>
  </div>
  <div class="row">
    <div class="slider">
      <span>벽 높이</span>
      <input type="range" id="wallH" min="300" max="2600" step="100" value="1300">
      <span class="val mono" id="wallHVal">1300mm</span>
    </div>
  </div>
</div>

<div class="hint">
  <span><b>드래그</b> 회전</span>
  <span><b>휠</b> 확대·축소</span>
  <span><b>우클릭/두 손가락</b> 이동</span>
</div>

<script>
(function(){
"use strict";

/* ---------- Standard 4-bay apartment (mm). Plan coords: x → east(right), y → south(down). ----------
   Clean 4-bay (판상형) shape; room dimensions use the measured values from the source drawing
   (bathrooms 1120×1586 · 1256×1586, doors 880·946·965·612, windows 1930·1515·1369·1450·1056 …). */
const rooms = [
  // ---- front bay (남향, 발코니 측) ----
  {id:'bed1',  name:'안방',      type:'room',    x1:0,     y1:2900, x2:3300,  y2:5900},  // 3300×3000
  {id:'liv',   name:'거실',      type:'room',    x1:3300,  y1:2900, x2:6900,  y2:5900},  // 3600×3000
  {id:'bed2',  name:'침실2',    type:'room',    x1:6900,  y1:3300, x2:9500,  y2:5900},  // 2600×2600
  {id:'bed3',  name:'침실3',    type:'room',    x1:9500,  y1:3300, x2:11900, y2:5900},  // 2400×2600
  // ---- back / service ----
  {id:'dress', name:'드레스룸',  type:'room',    x1:0,     y1:1314, x2:2180,  y2:2900},  // 2180×1586
  {id:'bath1', name:'욕실1',    type:'room',    x1:2180,  y1:1314, x2:3300,  y2:2900},  // 1120×1586
  {id:'kit',   name:'주방/식당', type:'room',    x1:3300,  y1:800,  x2:6900,  y2:2900},  // 3600×2100
  {id:'ent',   name:'현관',      type:'room',    x1:6900,  y1:2000, x2:9500,  y2:2900},  // 2600×900
  {id:'hall',  name:'복도',      type:'room',    x1:6900,  y1:2900, x2:11900, y2:3300},  // 5000×400
  {id:'bath2', name:'욕실2',    type:'room',    x1:9500,  y1:1314, x2:10756, y2:2900},  // 1256×1586
  {id:'pan',   name:'팬트리',    type:'room',    x1:10756, y1:1314, x2:11900, y2:2900},  // 1144×1586
  // ---- balconies / service (주거공용) ----
  {id:'balK',  name:'주방 발코니',type:'balcony', x1:3300,  y1:0,    x2:6900,  y2:800 },
  {id:'evac',  name:'대피공간',  type:'balcony', x1:0,     y1:5900, x2:1000,  y2:7100},
  {id:'balF',  name:'발코니',     type:'balcony', x1:1000,  y1:5900, x2:11900, y2:7100},
];

// Doors: axis 'h' spans x at constant y (cy); axis 'v' spans y at constant x (cx).
const doors = [
  {axis:'v', cx:3300,  cy:4400, w:946,  hinge:'top',   swing:'left', label:'946'},  // 안방 ← 거실
  {axis:'h', cy:2900,  cx:1000, w:880,  hinge:'left',  swing:'up',   label:'880'},  // 드레스룸
  {axis:'h', cy:2900,  cx:2740, w:800,  hinge:'right', swing:'up',   label:'800'},  // 욕실1
  {axis:'h', cy:3300,  cx:8200, w:880,  hinge:'left',  swing:'down', label:'880'},  // 침실2 ← 복도
  {axis:'h', cy:3300,  cx:10700,w:880,  hinge:'right', swing:'down', label:'880'},  // 침실3 ← 복도
  {axis:'h', cy:2900,  cx:10128,w:700,  hinge:'left',  swing:'up',   label:'700'},  // 욕실2 ← 복도
  {axis:'h', cy:2000,  cx:8200, w:965,  hinge:'left',  swing:'down', label:'965'},  // 현관 (현관문)
  {axis:'v', cx:1000,  cy:6500, w:612,  hinge:'top',   swing:'right',label:'612'},  // 대피공간
];

// Windows: translucent glass filling the gap (also drawn as yellow markers).
const windows = [
  {axis:'h', cy:5900,  cx:1650, w:1930},   // 안방  → 발코니 (1930)
  {axis:'h', cy:5900,  cx:5100, w:2600},   // 거실  → 발코니
  {axis:'h', cy:5900,  cx:8200, w:1515},   // 침실2 (남향, 1515)
  {axis:'h', cy:5900,  cx:10700,w:1369},   // 침실3 (남향, 1369)
  {axis:'h', cy:800,   cx:5100, w:1450},   // 주방  → 주방발코니 (1450)
  {axis:'v', cx:0,     cy:4400, w:1056},   // 안방  서측 (1056)
  {axis:'v', cx:11900, cy:4600, w:1200},   // 침실3 동측
];

// Voids: open connections that cut the wall but render nothing (LDK openness).
const voids = [
  {axis:'h', cy:2900, cx:5100, w:2600},    // 거실 ↔ 주방/식당
  {axis:'h', cy:2900, cx:8200, w:1600},    // 현관 ↔ 복도
];

const openings = doors.concat(windows).concat(voids);

/* ---------- bounds / target ---------- */
let BX1=1e9,BY1=1e9,BX2=-1e9,BY2=-1e9;
rooms.forEach(r=>{BX1=Math.min(BX1,r.x1);BY1=Math.min(BY1,r.y1);BX2=Math.max(BX2,r.x2);BY2=Math.max(BY2,r.y2);});
const CENTER = {x:(BX1+BX2)/2, y:400, z:(BY1+BY2)/2};
const SPAN = Math.max(BX2-BX1, BY2-BY1);

const cam = {yaw:0.58, pitch:0.98, dist:SPAN*1.5, tx:CENTER.x, ty:CENTER.y, tz:CENTER.z};
const DEFAULT_CAM = Object.assign({}, cam);

let WALL_H = 1300;
let showDims=true, showLabels=true, ghost=false;

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', ()=>{resize();draw();});

/* ---------- projection ---------- */
let VIEW = null;
function buildView(){
  const cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const cyv=Math.cos(cam.yaw), syv=Math.sin(cam.yaw);
  const dir = {x:cp*syv, y:sp, z:cp*cyv};
  const eye = {x:cam.tx+dir.x*cam.dist, y:cam.ty+dir.y*cam.dist, z:cam.tz+dir.z*cam.dist};
  const fwd = {x:cam.tx-eye.x, y:cam.ty-eye.y, z:cam.tz-eye.z}; norm(fwd);
  let right = cross(fwd,{x:0,y:1,z:0}); norm(right);
  let up = cross(right,fwd); norm(up);
  const focal = 0.5*H / Math.tan(0.5*0.92);
  VIEW = {eye,right,up,fwd,focal};
}
function cross(a,b){return {x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x};}
function norm(v){const l=Math.hypot(v.x,v.y,v.z)||1;v.x/=l;v.y/=l;v.z/=l;return v;}
function project(p){
  const V=VIEW, rx=p.x-V.eye.x, ry=p.y-V.eye.y, rz=p.z-V.eye.z;
  const vz = rx*V.fwd.x+ry*V.fwd.y+rz*V.fwd.z;
  if(vz<=1) return {behind:true, z:vz};
  const vx = rx*V.right.x+ry*V.right.y+rz*V.right.z;
  const vy = rx*V.up.x+ry*V.up.y+rz*V.up.z;
  return {x:W/2 + vx*V.focal/vz, y:H/2 - vy*V.focal/vz, z:vz, behind:false};
}

/* ---------- geometry ---------- */
const WALL_T = 110;
function box(x1,y1,z1,x2,y2,z2){
  const p=[
    {x:x1,y:y1,z:z1},{x:x2,y:y1,z:z1},{x:x2,y:y1,z:z2},{x:x1,y:y1,z:z2},
    {x:x1,y:y2,z:z1},{x:x2,y:y2,z:z1},{x:x2,y:y2,z:z2},{x:x1,y:y2,z:z2},
  ];
  return [
    [p[4],p[5],p[6],p[7]],[p[0],p[3],p[2],p[1]],
    [p[0],p[1],p[5],p[4]],[p[2],p[3],p[7],p[6]],
    [p[3],p[0],p[4],p[7]],[p[1],p[2],p[6],p[5]],
  ];
}
function segmentsFor(axis, c, a, b){
  const gaps=[];
  openings.forEach(o=>{
    if(o.axis!==axis) return;
    const oc = axis==='h'? o.cy : o.cx;
    if(Math.abs(oc-c) > 1) return;
    const s = (axis==='h'? o.cx : o.cy) - o.w/2, e = s + o.w;
    if(e> a+1 && s< b-1) gaps.push([Math.max(a,s), Math.min(b,e)]);
  });
  gaps.sort((p,q)=>p[0]-q[0]);
  const segs=[]; let cur=a;
  gaps.forEach(g=>{ if(g[0]>cur+1) segs.push([cur,g[0]]); cur=Math.max(cur,g[1]); });
  if(cur<b-1) segs.push([cur,b]);
  return segs;
}
function areaM2(r){ return (r.x2-r.x1)*(r.y2-r.y1)/1e6; }

const FLOOR={room:[0x3a,0x44,0x52], util:[0x46,0x41,0x38], balcony:[0x30,0x3b,0x37]};
function buildFaces(){
  const faces=[];
  const push=(quads,color,kind,rid)=>{quads.forEach(q=>faces.push({q,color,kind,rid}));};

  // floors
  rooms.forEach(r=>{
    const q=[{x:r.x1,y:0,z:r.y1},{x:r.x2,y:0,z:r.y1},{x:r.x2,y:0,z:r.y2},{x:r.x1,y:0,z:r.y2}];
    faces.push({q, color: r.id===activeRoom?[0x2c,0x4a,0x6e]:FLOOR[r.type], kind:'floor', rid:r.id});
  });

  // walls (per room, height varies for balconies)
  const wallCol=[0xba,0xb2,0xa5];
  const seen=new Set();
  rooms.forEach(r=>{
    const h = r.type==='balcony' ? Math.min(WALL_H,480) : WALL_H;
    const edges=[['h',r.y1,r.x1,r.x2],['h',r.y2,r.x1,r.x2],['v',r.x1,r.y1,r.y2],['v',r.x2,r.y1,r.y2]];
    edges.forEach(e=>{
      const key=e.join(':')+':'+h; if(seen.has(key))return; seen.add(key);
      const [axis,c,a,b]=e;
      segmentsFor(axis,c,a,b).forEach(([s,en])=>{
        const bx = axis==='h'? box(s,0,c-WALL_T/2,en,h,c+WALL_T/2) : box(c-WALL_T/2,0,s,c+WALL_T/2,en,h);
        push(bx, wallCol, 'wall', null);
      });
    });
  });

  // glass windows
  windows.forEach(o=>{
    const yy1=WALL_H*0.28, yy2=WALL_H*0.92;
    let bx;
    if(o.axis==='h') bx=box(o.cx-o.w/2,yy1,o.cy-28, o.cx+o.w/2,yy2,o.cy+28);
    else             bx=box(o.cx-28,yy1,o.cy-o.w/2, o.cx+28,yy2,o.cy+o.w/2);
    push(bx,[0x8f,0xc8,0xf0],'glass',null);
  });

  // door leaves
  doors.forEach(o=> push(doorLeaf(o),[0xd8,0x86,0x52],'door',null));

  return faces;
}
function doorLeaf(o){
  const t=42;
  if(o.axis==='h'){
    const hx=o.hinge==='left'? o.cx-o.w/2 : o.cx+o.w/2, hz=o.cy;
    const dz=o.swing==='up'? -o.w : o.w, ez=hz+dz;
    return box(Math.min(hx,hx)-t,0,Math.min(hz,ez), Math.max(hx,hx)+t,WALL_H*0.92,Math.max(hz,ez));
  } else {
    const hz=o.hinge==='top'? o.cy-o.w/2 : o.cy+o.w/2, hx=o.cx;
    const dx=o.swing==='left'? -o.w : o.w, ex=hx+dx;
    return box(Math.min(hx,ex),0,Math.min(hz,hz)-t, Math.max(hx,ex),WALL_H*0.92,Math.max(hz,hz)+t);
  }
}
function doorArc(o){
  let hx,hz,a0,a1;
  if(o.axis==='h'){
    hx=o.hinge==='left'? o.cx-o.w/2 : o.cx+o.w/2; hz=o.cy;
    a0=o.hinge==='left'?0:Math.PI; a1=o.swing==='up'?-Math.PI/2:Math.PI/2;
  } else {
    hx=o.cx; hz=o.hinge==='top'? o.cy-o.w/2 : o.cy+o.w/2;
    a0=o.hinge==='top'?Math.PI/2:-Math.PI/2; a1=o.swing==='left'?Math.PI:0;
  }
  const pts=[]; const N=14;
  for(let i=0;i<=N;i++){const a=a0+(a1-a0)*i/N; pts.push({x:hx+Math.cos(a)*o.w, z:hz+Math.sin(a)*o.w});}
  pts.unshift({x:hx,z:hz});
  return pts;
}

/* ---------- shading ---------- */
const LIGHT = norm({x:0.35,y:0.9,z:0.25});
function faceNormal(q){
  const a={x:q[1].x-q[0].x,y:q[1].y-q[0].y,z:q[1].z-q[0].z};
  const b={x:q[2].x-q[0].x,y:q[2].y-q[0].y,z:q[2].z-q[0].z};
  return norm(cross(a,b));
}
function shade(col,q){
  const n=faceNormal(q);
  let d=Math.abs(n.x*LIGHT.x+n.y*LIGHT.y+n.z*LIGHT.z);
  const k=0.42+0.58*d;
  return [Math.min(255,col[0]*k)|0, Math.min(255,col[1]*k)|0, Math.min(255,col[2]*k)|0];
}

/* ---------- draw ---------- */
function matchTheme(){
  const attr=document.documentElement.getAttribute('data-theme');
  if(attr) return attr;
  return window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
}
function getVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function bgGradient(){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(matchTheme()==='light'){ g.addColorStop(0,'#f3f6fa'); g.addColorStop(1,'#dbe2ec'); }
  else { g.addColorStop(0,'#12161c'); g.addColorStop(1,'#0a0d11'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function line3(c,p1,p2){
  const a=project(p1),b=project(p2);
  if(a.behind||b.behind) return;
  c.moveTo(a.x,a.y); c.lineTo(b.x,b.y);
}
function drawGrid(){
  const isLight=matchTheme()==='light';
  ctx.strokeStyle = isLight? 'rgba(90,110,140,.16)':'rgba(120,150,190,.10)';
  ctx.lineWidth=1;
  const step=500, ext=1400;
  const gx1=BX1-ext, gx2=BX2+ext, gz1=BY1-ext, gz2=BY2+ext;
  ctx.beginPath();
  for(let x=Math.floor(gx1/step)*step; x<=gx2; x+=step) line3(ctx,{x,y:0,z:gz1},{x,y:0,z:gz2});
  for(let z=Math.floor(gz1/step)*step; z<=gz2; z+=step) line3(ctx,{x:gx1,y:0,z},{x:gx2,y:0,z});
  ctx.stroke();
}

function draw(){
  buildView();
  bgGradient();
  drawGrid();

  const faces=buildFaces();
  const drawable=[];
  for(const f of faces){
    let zsum=0,ok=true;const pr=[];
    for(const v of f.q){const p=project(v); if(p.behind){ok=false;break;} pr.push(p); zsum+=p.z;}
    if(!ok) continue;
    drawable.push({pr, z:zsum/f.q.length, f});
  }
  drawable.sort((a,b)=>b.z-a.z);

  const isLight=matchTheme()==='light';
  for(const d of drawable){
    const f=d.f, pr=d.pr;
    ctx.beginPath(); ctx.moveTo(pr[0].x,pr[0].y);
    for(let i=1;i<pr.length;i++) ctx.lineTo(pr[i].x,pr[i].y);
    ctx.closePath();
    if(f.kind==='glass'){
      ctx.fillStyle='rgba(140,200,240,.30)'; ctx.fill();
      ctx.strokeStyle='rgba(150,205,245,.55)'; ctx.lineWidth=1; ctx.stroke(); continue;
    }
    let col=shade(f.color,f.q);
    let alpha=1;
    if(f.kind==='wall' && ghost) alpha=0.30;
    if(f.kind==='floor') alpha=0.96;
    ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${alpha})`; ctx.fill();
    if(f.kind==='wall' && !ghost){
      ctx.strokeStyle= isLight?'rgba(60,70,85,.25)':'rgba(0,0,0,.28)'; ctx.lineWidth=1; ctx.stroke();
    }
    if(f.kind==='floor'){
      ctx.strokeStyle= f.rid===activeRoom? 'rgba(76,159,254,.9)':(isLight?'rgba(90,105,125,.4)':'rgba(150,175,205,.22)');
      ctx.lineWidth= f.rid===activeRoom?2:1; ctx.stroke();
    }
  }

  // door swing arcs
  ctx.strokeStyle= isLight?'rgba(40,50,65,.55)':'rgba(230,235,245,.5)';
  ctx.lineWidth=1.3; ctx.beginPath();
  doors.forEach(o=>{
    const pts=doorArc(o);
    for(let i=0;i<pts.length-1;i++) line3(ctx,{x:pts[i].x,y:8,z:pts[i].z},{x:pts[i+1].x,y:8,z:pts[i+1].z});
  });
  ctx.stroke();

  // window markers
  ctx.fillStyle=getVar('--amber');
  windows.forEach(o=>{
    const p=project({x:o.cx,y:WALL_H*0.6,z:o.cy}); if(p.behind)return;
    ctx.beginPath(); ctx.globalAlpha=.9; ctx.arc(p.x,p.y,4.2,0,7); ctx.fill(); ctx.globalAlpha=1;
  });

  if(showDims) drawDimensions();
  if(showLabels) drawLabels();
}

/* ---------- dimensions ---------- */
function drawDimensions(){
  const amber=getVar('--amber');
  ctx.font='600 12px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  rooms.forEach(r=>{
    if(r.type==='balcony') return;
    const w=r.x2-r.x1, d=r.y2-r.y1, off=200;
    dimLine({x:r.x1,z:r.y1-off},{x:r.x2,z:r.y1-off}, ''+w, amber);
    dimLine({x:r.x1-off,z:r.y1},{x:r.x1-off,z:r.y2}, ''+d, amber);
  });
}
function dimLine(p1,p2,txt,color){
  const y=10;
  const a=project({x:p1.x,y,z:p1.z}), b=project({x:p2.x,y,z:p2.z});
  if(a.behind||b.behind) return;
  ctx.strokeStyle=color; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
  ctx.moveTo(a.x-4,a.y-4);ctx.lineTo(a.x+4,a.y+4);
  ctx.moveTo(b.x-4,b.y-4);ctx.lineTo(b.x+4,b.y+4);
  ctx.stroke();
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, tw=ctx.measureText(txt).width+8;
  ctx.fillStyle= matchTheme()==='light'?'rgba(255,255,255,.9)':'rgba(10,14,20,.82)';
  ctx.fillRect(mx-tw/2,my-9,tw,18);
  ctx.fillStyle=color; ctx.fillText(txt,mx,my+1);
}

/* ---------- labels ---------- */
function drawLabels(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  rooms.forEach(r=>{
    if(!r.name) return;
    const cx=(r.x1+r.x2)/2, cz=(r.y1+r.y2)/2;
    const p=project({x:cx,y:60,z:cz}); if(p.behind) return;
    const active=r.id===activeRoom;
    const hasArea = r.type!=='balcony';
    const area = hasArea? areaM2(r).toFixed(1)+'㎡' : '';
    ctx.font='600 13.5px "Malgun Gothic","Segoe UI",sans-serif';
    const tw=Math.max(ctx.measureText(r.name).width, 34)+16;
    ctx.fillStyle= active? getVar('--accent') : (matchTheme()==='light'?'rgba(255,255,255,.92)':'rgba(16,21,28,.86)');
    roundRect(p.x-tw/2,p.y-15, tw, hasArea?31:21, 7); ctx.fill();
    ctx.fillStyle= active? '#fff' : getVar('--ink');
    ctx.fillText(r.name, p.x, p.y-(hasArea?5:0));
    if(hasArea){
      ctx.font='600 10.5px ui-monospace,monospace';
      ctx.fillStyle= active?'rgba(255,255,255,.85)':getVar('--muted');
      ctx.fillText(area, p.x, p.y+9);
    }
  });
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* ---------- room list ---------- */
let activeRoom=null;
function buildRoomList(){
  const el=document.getElementById('roomList');
  rooms.forEach(r=>{
    const w=r.x2-r.x1, d=r.y2-r.y1;
    const div=document.createElement('div');
    div.className='rm'+(r.type==='balcony'?' bal':''); div.dataset.id=r.id;
    const areaTxt = r.type!=='balcony'? `<small>${areaM2(r).toFixed(1)}㎡</small>`:'';
    div.innerHTML=`<span class="nm">${r.name}${areaTxt}</span>`+
      `<span class="dim mono"><b>${w}</b>×<b>${d}</b><br>mm</span>`;
    div.addEventListener('click',()=>focusRoom(r));
    el.appendChild(div);
  });
}
function focusRoom(r){
  activeRoom=r.id;
  document.querySelectorAll('.rm').forEach(e=>e.classList.toggle('active', e.dataset.id===r.id));
  animateTo({tx:(r.x1+r.x2)/2, tz:(r.y1+r.y2)/2, dist:Math.max(r.x2-r.x1,r.y2-r.y1)*2.6+2200});
}

/* ---------- camera anim ---------- */
let anim=null;
function animateTo(tgt){
  anim={from:{tx:cam.tx,tz:cam.tz,dist:cam.dist}, tgt, t0:performance.now(), dur:520};
  requestAnimationFrame(tick);
}
function tick(now){
  if(!anim)return;
  let t=(now-anim.t0)/anim.dur; if(t>1)t=1;
  const e=1-Math.pow(1-t,3);
  cam.tx=anim.from.tx+(anim.tgt.tx-anim.from.tx)*e;
  cam.tz=anim.from.tz+(anim.tgt.tz-anim.from.tz)*e;
  cam.dist=anim.from.dist+(anim.tgt.dist-anim.from.dist)*e;
  draw();
  if(t<1) requestAnimationFrame(tick); else anim=null;
}

/* ---------- interaction ---------- */
let dragging=false, panning=false, lx=0, ly=0;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{dragging=true; panning=(e.button===2||e.shiftKey); lx=e.clientX; ly=e.clientY; cv.classList.add('drag'); anim=null;});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if(panning) panCam(dx,dy); else rotateCam(dx,dy);
  draw();
});
window.addEventListener('mouseup',()=>{dragging=false;cv.classList.remove('drag');});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  cam.dist*=Math.exp(e.deltaY*0.0011);
  cam.dist=Math.max(800,Math.min(SPAN*6,cam.dist)); draw();
},{passive:false});
function rotateCam(dx,dy){ cam.yaw-=dx*0.006; cam.pitch=Math.max(0.08,Math.min(1.55, cam.pitch+dy*0.006)); }
function panCam(dx,dy){
  const k=cam.dist*0.0016;
  cam.tx -= (VIEW.right.x*dx - VIEW.up.x*dy)*k;
  cam.ty -= (VIEW.right.y*dx - VIEW.up.y*dy)*k;
  cam.tz -= (VIEW.right.z*dx - VIEW.up.z*dy)*k;
}
let touchMode=0, tpx=0,tpy=0, tdist=0;
cv.addEventListener('touchstart',e=>{
  anim=null;
  if(e.touches.length===1){touchMode=1;tpx=e.touches[0].clientX;tpy=e.touches[0].clientY;}
  else if(e.touches.length===2){touchMode=2;tdist=tdd(e);tpx=(e.touches[0].clientX+e.touches[1].clientX)/2;tpy=(e.touches[0].clientY+e.touches[1].clientY)/2;}
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(touchMode===1){
    const dx=e.touches[0].clientX-tpx, dy=e.touches[0].clientY-tpy;
    tpx=e.touches[0].clientX;tpy=e.touches[0].clientY; rotateCam(dx,dy);
  }else if(touchMode===2 && e.touches.length===2){
    const nd=tdd(e); cam.dist*=tdist/nd; cam.dist=Math.max(800,Math.min(SPAN*6,cam.dist)); tdist=nd;
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2, my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    panCam(mx-tpx,my-tpy); tpx=mx;tpy=my;
  }
  draw();
},{passive:false});
cv.addEventListener('touchend',e=>{touchMode=e.touches.length;},{passive:false});
function tdd(e){return Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);}

/* ---------- buttons ---------- */
document.getElementById('btnReset').onclick=()=>{Object.assign(cam,DEFAULT_CAM);activeRoom=null;document.querySelectorAll('.rm').forEach(e=>e.classList.remove('active'));draw();};
document.getElementById('btnTop').onclick=()=>{cam.pitch=1.549;cam.yaw=0;cam.dist=SPAN*2.1;cam.tx=CENTER.x;cam.ty=CENTER.y;cam.tz=CENTER.z;draw();};
const bDims=document.getElementById('btnDims'), bLab=document.getElementById('btnLabels'), bGhost=document.getElementById('btnGhost');
bDims.onclick=()=>{showDims=!showDims;bDims.classList.toggle('on',showDims);draw();};
bLab.onclick=()=>{showLabels=!showLabels;bLab.classList.toggle('on',showLabels);draw();};
bGhost.onclick=()=>{ghost=!ghost;bGhost.classList.toggle('on',ghost);draw();};
const wh=document.getElementById('wallH'), whv=document.getElementById('wallHVal');
wh.oninput=()=>{WALL_H=+wh.value;whv.textContent=WALL_H+'mm';draw();};

window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- init ---------- */
buildRoomList();
resize();
draw();
})();
</script>
</body>
</html>
