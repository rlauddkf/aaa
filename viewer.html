<style>

<script>
(function(){
"use strict";
const P = window.PLAN || {w:1000,h:1000,seg:[],txt:[]};
const SEG = P.seg, NS = SEG.length/4;
const TXT = P.txt||[];
const WALL_H = 2300;

const cv=document.getElementById('stage'), ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth;H=innerHeight;
  cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',()=>{resize();draw();});

let mode='2d', showTxt=true;
const view={scale:0.02, ox:0, oy:0};   // 2D: sx=ox+wx*s ; sy=oy-wy*s  (y-up)
const cam={yaw:0.62, pitch:0.9, dist:120000, tx:P.w/2, ty:WALL_H*0.5, tz:P.h/2};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function theme(){const a=document.documentElement.getAttribute('data-theme');return a||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');}

/* ---------- 2D ---------- */
function fit2d(){ const m=90; view.scale=Math.min((W-m*2)/P.w,(H-m*2-40)/P.h); if(!isFinite(view.scale)||view.scale<=0)view.scale=0.02;
  view.ox=(W-P.w*view.scale)/2; view.oy=(H+P.h*view.scale)/2; }
function draw2d(){
  ctx.fillStyle=css('--bg'); ctx.fillRect(0,0,W,H);
  const s=view.scale, ox=view.ox, oy=view.oy;
  const path=new Path2D();
  for(let i=0;i<NS;i++){ const k=i*4;
    path.moveTo(ox+SEG[k]*s, oy-SEG[k+1]*s); path.lineTo(ox+SEG[k+2]*s, oy-SEG[k+3]*s);
  }
  ctx.strokeStyle=css('--plan'); ctx.lineWidth=1; ctx.stroke(path);
  if(showTxt){ ctx.fillStyle=css('--ink'); ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const t of TXT){ const fs=t[2]*s; if(fs<6||fs>60)continue; const x=ox+t[0]*s, y=oy-t[1]*s;
      if(x<-50||x>W+50||y<-20||y>H+20)continue; ctx.font='600 '+Math.min(fs,26)+'px "Malgun Gothic","Segoe UI",sans-serif';
      ctx.fillStyle=t[4]==='0_실명'?css('--amber'):css('--ink'); ctx.fillText(t[3],x,y); } }
}

/* ---------- 3D ---------- */
function cross(a,b){return{x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x};}
function norm(v){const l=Math.hypot(v.x,v.y,v.z)||1;v.x/=l;v.y/=l;v.z/=l;return v;}
let V=null;
function frame3d(){ cam.tx=P.w/2; cam.tz=P.h/2; cam.ty=WALL_H*0.5; cam.dist=Math.max(P.w,P.h)*1.25+20000; }
function buildV(){ const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
  const dir={x:cp*sy,y:sp,z:cp*cy}, eye={x:cam.tx+dir.x*cam.dist,y:cam.ty+dir.y*cam.dist,z:cam.tz+dir.z*cam.dist};
  const fwd={x:cam.tx-eye.x,y:cam.ty-eye.y,z:cam.tz-eye.z}; norm(fwd);
  let r=cross(fwd,{x:0,y:1,z:0}); norm(r); let up=cross(r,fwd); norm(up);
  V={ex:eye.x,ey:eye.y,ez:eye.z,rx:r.x,ry:r.y,rz:r.z,ux:up.x,uy:up.y,uz:up.z,fx:fwd.x,fy:fwd.y,fz:fwd.z,focal:0.5*H/Math.tan(0.46)};
}
// project into sx,sy; returns false if behind. writes to out[0],out[1]
function proj(x,y,z,out){ const rx=x-V.ex,ry=y-V.ey,rz=z-V.ez; const vz=rx*V.fx+ry*V.fy+rz*V.fz;
  if(vz<=1)return false; const f=V.focal/vz; out[0]=W/2+(rx*V.rx+ry*V.ry+rz*V.rz)*f; out[1]=H/2-(rx*V.ux+ry*V.uy+rz*V.uz)*f; return true; }
function draw3d(fast){
  buildV(); const isLight=theme()==='light';
  const g=ctx.createLinearGradient(0,0,0,H);
  if(isLight){g.addColorStop(0,'#f3f6fa');g.addColorStop(1,'#dbe2ec');}else{g.addColorStop(0,'#12161c');g.addColorStop(1,'#0a0d11');}
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // ground grid
  const step=5000, a=[0,0],b=[0,0];
  ctx.strokeStyle=isLight?'rgba(90,110,140,.18)':'rgba(120,150,190,.10)'; ctx.lineWidth=1; const gp=new Path2D();
  for(let x=-5000;x<=P.w+5000;x+=step){ if(proj(x,0,-5000,a)&&proj(x,0,P.h+5000,b)){gp.moveTo(a[0],a[1]);gp.lineTo(b[0],b[1]);} }
  for(let z=-5000;z<=P.h+5000;z+=step){ if(proj(-5000,0,z,a)&&proj(P.w+5000,0,z,b)){gp.moveTo(a[0],a[1]);gp.lineTo(b[0],b[1]);} }
  ctx.stroke(gp);
  // walls
  const A=[0,0],B=[0,0],C=[0,0],D=[0,0];
  const wallP=new Path2D(), baseP=new Path2D(), topP=new Path2D();
  const stepI = fast?2:1;
  for(let i=0;i<NS;i+=stepI){ const k=i*4, x1=SEG[k],z1=SEG[k+1],x2=SEG[k+2],z2=SEG[k+3];
    if(!proj(x1,0,z1,A))continue; if(!proj(x2,0,z2,B))continue; if(!proj(x2,WALL_H,z2,C))continue; if(!proj(x1,WALL_H,z1,D))continue;
    if(!fast){ wallP.moveTo(A[0],A[1]);wallP.lineTo(B[0],B[1]);wallP.lineTo(C[0],C[1]);wallP.lineTo(D[0],D[1]);wallP.closePath(); }
    baseP.moveTo(A[0],A[1]);baseP.lineTo(B[0],B[1]);
    topP.moveTo(D[0],D[1]);topP.lineTo(C[0],C[1]);
  }
  if(!fast){ ctx.fillStyle=isLight?'rgba(183,176,162,.9)':'rgba(150,142,128,.82)'; ctx.fill(wallP,'nonzero'); }
  ctx.strokeStyle=isLight?'rgba(70,80,95,.55)':'rgba(20,26,34,.6)'; ctx.lineWidth=1; ctx.stroke(baseP);
  ctx.strokeStyle=isLight?'rgba(120,130,150,.5)':'rgba(200,215,235,.32)'; ctx.lineWidth=1; ctx.stroke(topP);
}

/* ---------- draw dispatch ---------- */
let raf=0;
function draw(fast){ if(raf)return; raf=requestAnimationFrame(()=>{raf=0; if(mode==='2d')draw2d(); else draw3d(fast);}); }

/* ---------- interaction ---------- */
let act=null;
function xy(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{const[x,y]=xy(e); act={t:(mode==='3d'&&e.button!==2&&!e.shiftKey)?'orbit':'pan',x,y}; });
addEventListener('mousemove',e=>{ if(!act)return; const[x,y]=xy(e),dx=x-act.x,dy=y-act.y; act.x=x;act.y=y;
  if(act.t==='pan'){ if(mode==='2d'){view.ox+=dx;view.oy+=dy;} else { const k=cam.dist*0.0016; cam.tx-=(V.rx*dx-V.ux*dy)*k;cam.ty-=(V.ry*dx-V.uy*dy)*k;cam.tz-=(V.rz*dx-V.uz*dy)*k; } draw(true); }
  else { cam.yaw-=dx*0.006; cam.pitch=clamp(cam.pitch+dy*0.006,0.05,1.55); draw(true); }
});
addEventListener('mouseup',()=>{ if(act){act=null; draw(false);} });
cv.addEventListener('wheel',e=>{ e.preventDefault(); const[cx,cy]=xy(e);
  if(mode==='2d'){ const wx=(cx-view.ox)/view.scale, wy=(view.oy-cy)/view.scale; view.scale=clamp(view.scale*Math.exp(-e.deltaY*0.0011),0.001,1);
    view.ox=cx-wx*view.scale; view.oy=cy+wy*view.scale; draw(); }
  else { cam.dist=clamp(cam.dist*Math.exp(e.deltaY*0.0011),4000,600000); draw(); }
},{passive:false});
// touch
let tp=[];
function tps(e){const r=cv.getBoundingClientRect();return[...e.touches].map(t=>[t.clientX-r.left,t.clientY-r.top]);}
cv.addEventListener('touchstart',e=>{e.preventDefault();tp=tps(e); if(tp.length===1)act={t:mode==='3d'?'orbit':'pan',x:tp[0][0],y:tp[0][1]}; },{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const p=tps(e);
  if(p.length===1&&act){ const dx=p[0][0]-act.x,dy=p[0][1]-act.y;act.x=p[0][0];act.y=p[0][1];
    if(act.t==='pan'&&mode==='2d'){view.ox+=dx;view.oy+=dy;} else if(mode==='3d'){cam.yaw-=dx*0.006;cam.pitch=clamp(cam.pitch+dy*0.006,0.05,1.55);} draw(true); }
  else if(p.length===2&&tp.length===2){ const od=Math.hypot(tp[0][0]-tp[1][0],tp[0][1]-tp[1][1]),nd=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);
    const om=[(tp[0][0]+tp[1][0])/2,(tp[0][1]+tp[1][1])/2],nm=[(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2];
    if(mode==='2d'){ const wx=(nm[0]-view.ox)/view.scale,wy=(view.oy-nm[1])/view.scale; view.scale=clamp(view.scale*(nd/od||1),0.001,1);
      view.ox=nm[0]-wx*view.scale+(nm[0]-om[0]); view.oy=nm[1]+wy*view.scale+(nm[1]-om[1]); }
    else { cam.dist=clamp(cam.dist*(od/nd||1),4000,600000); cam.yaw-=(nm[0]-om[0])*0.005; cam.pitch=clamp(cam.pitch+(nm[1]-om[1])*0.005,0.05,1.55); } draw(true); }
  tp=p;
},{passive:false});
cv.addEventListener('touchend',e=>{ if(e.touches.length===0){act=null;draw(false);} tp=tps(e); },{passive:false});

/* ---------- UI ---------- */
const b2d=document.getElementById('b2d'),b3d=document.getElementById('b3d'),bTxt=document.getElementById('bTxt');
function setMode(m){ mode=m; b2d.classList.toggle('on',m==='2d'); b3d.classList.toggle('on',m==='3d');
  bTxt.style.display=m==='2d'?'':'none'; if(m==='3d')frame3d(); updateHint(); draw(false); }
b2d.onclick=()=>setMode('2d'); b3d.onclick=()=>setMode('3d');
document.getElementById('bFit').onclick=()=>{ if(mode==='2d'){fit2d();}else{frame3d();cam.yaw=0.62;cam.pitch=0.9;} draw(false); };
bTxt.onclick=()=>{ showTxt=!showTxt; bTxt.classList.toggle('on',showTxt); draw(false); };
function updateHint(){ document.getElementById('hint').innerHTML = mode==='3d'
  ? '<span><b>드래그</b> 회전</span><span><b>휠</b> 확대</span><span><b>우클릭</b> 이동</span>'
  : '<span><b>드래그</b> 이동</span><span><b>휠</b> 확대·축소</span>'; }
document.getElementById('meta').innerHTML =
  `<span>도면 <b>${(P.w/1000).toFixed(1)}×${(P.h/1000).toFixed(1)}m</b></span>`+
  `<span>선 <b>${NS.toLocaleString()}</b>개</span>`+
  `<span>벽높이 <b>2300mm</b></span>`;
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>draw(false));
new MutationObserver(()=>draw(false)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- init ---------- */
resize(); fit2d(); updateHint();
document.getElementById('busy').style.display='none';
draw(false);
})();
</script>

</body></html>
