name: Build Windows EXE

on:
  push:
    branches:
      - claude/powerpoint-batch-image-replace-razujx
    paths:
      - "pptx_image_replacer.py"
      - "requirements-pptx.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pptx.txt
          pip install pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed
          --name PPTImageReplacer
          --hidden-import win32timezone
          --hidden-import win32com.client
          pptx_image_replacer.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPTImageReplacer
          path: dist/PPTImageReplacer.exe

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pptx-image-replacer-latest
          name: PowerPoint 사진 일괄 교체 (Windows EXE)
          body: |
            Windows용 실행 파일입니다. `PPTImageReplacer.exe` 를 내려받아 실행하세요.
            (Windows + PowerPoint 데스크톱 설치 필요)
          files: dist/PPTImageReplacer.exe
